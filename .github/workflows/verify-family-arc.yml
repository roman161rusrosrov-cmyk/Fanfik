name: Verify family arc

on:
  push:
    branches:
      - feature/family-arc-60x2
    paths:
      - .github/workflows/verify-family-arc.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-arc-60x2
      - name: Check JavaScript syntax
        run: node --check family-arc.js
      - name: Check integration and 60 x 2 contract
        shell: python
        run: |
          from pathlib import Path
          import re
          js = Path('family-arc.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          block = js.split('const EVENTS = [',1)[1].split('];',1)[0]
          events = len(re.findall(r'^\s*".*\|.*\|.*",?\s*$', block, re.M))
          assert events == 60, f'Expected 60 chapter events, got {events}'
          assert 'labels.map((label, i)' in js, 'Two-photo renderer missing'
          assert 'family-arc.js' in index, 'family-arc.js not loaded by index'
          assert 'family-arc.js' in sw and 'seven-minutes-v2' in sw, 'offline cache not updated'
          print('OK: 60 chapter events; renderer outputs 2 scene frames per chapter = 120 total.')
