name: Apply family arc patch

on:
  push:
    branches:
      - feature/family-arc-60x2
    paths:
      - .github/workflows/apply-family-arc.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/family-arc-60x2
      - name: Patch reader and offline cache
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<script src="app.js" defer></script>'
          addon = '<script src="family-arc.js" defer></script>'
          if addon not in text:
              if marker not in text:
                  raise SystemExit('app.js marker not found')
              text = text.replace(marker, marker + '\n  ' + addon, 1)
          text = text.replace('о двух городах', 'о трёх городах')
          text = text.replace('Одна случайность.<br>Два города.', 'Одна случайность.<br>Три города.')
          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace('seven-minutes-v1', 'seven-minutes-v2')
          if '"./family-arc.js"' not in sw_text:
              sw_text = sw_text.replace('"./app.js",', '"./app.js",\n  "./family-arc.js",', 1)
          sw.write_text(sw_text, encoding='utf-8')

          workflow = Path('.github/workflows/apply-family-arc.yml')
          workflow.unlink(missing_ok=True)
      - name: Commit patched files
        run: |
          git config user.name "fanfik-patcher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-family-arc.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect expanded family storyline"
          git push origin HEAD:feature/family-arc-60x2
